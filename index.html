<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<title>AltaDomus</title>
<link rel="icon" type="image/png" href="AltaDomus.png">
<link rel="apple-touch-icon" href="AltaDomus.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    :root {
      --barra: 88px;
      --sfondo: url("Sfondod.png");
      --colore-fondo: #ffffff;   /* fine pagina bianca */

      /* ▼ COLORI ▼ */
      --accento: #8ED0D6;                      /* azzurro chiaro del logo AltaDomus */
      /* Verde petrolio con riflesso diagonale, come nella foto; sempre un po' trasparente (0.9 circa = 10% di trasparenza).
         Per cambiare l'intensità modifica i tre colori; per la trasparenza cambia i valori 0.88, 0.92 e 0.95 */
      --pannello: linear-gradient(135deg,
                    rgba(9, 52, 64, 0.88) 0%,
                    rgba(4, 30, 40, 0.92) 45%,
                    rgba(1, 14, 22, 0.95) 100%);
      --testo-pannello: #E8F7F8;              /* bianco azzurrato: nomi delle lingue leggibili sul verde petrolio */
    }

    html { background-color: var(--colore-fondo); }

    body::before {
      content: "";
      position: fixed;
      top: var(--barra);
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
      background:
        linear-gradient(to bottom, transparent calc(100% - 180px), var(--colore-fondo) 100%),
        var(--sfondo) center / cover no-repeat;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: calc(var(--barra) + 32px) 24px 24px;
    }

    .barra {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      height: var(--barra);
      padding: 0 20px;
      background: var(--pannello);
      border-bottom: 1px solid rgba(142, 208, 214, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.2);
    }

    .barra img {
      height: 120px;
      width: 120px;
      object-fit: contain;
      display: block;
    }

    .barra h1 {
      font-family: "Cinzel", "Trajan Pro", Georgia, "Times New Roman", serif;
      font-size: 2.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      line-height: 1.1;
      color: #8ED0D6; /* azzurro di riserva */
      /* effetto azzurro metallico in rilievo, sfumato come nel logo */
      background: linear-gradient(180deg, #D2F1F3 0%, #8ED0D6 45%, #4A97A6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.55));
    }

    @media (max-width: 480px) {
      :root { --barra: 64px; }
      .barra { gap: 10px; padding: 0 12px; }
      .barra img { height: 54px; width: 44px; }
      .barra h1 { font-size: 1.05rem; letter-spacing: 0.05em; }
    }

    .riquadro {
      background: var(--pannello);
      border: 1px solid rgba(142, 208, 214, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 14px;
      padding: 44px 56px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
    }

    .lingue {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lingue a {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 14px 16px;
      border-radius: 8px;
      color: var(--testo-pannello);
      text-decoration: none;
      font-size: 1.5rem;
      transition: background 0.2s;
    }

    .lingue a:hover,
    .lingue a:focus-visible {
      background: rgba(255, 255, 255, 0.16);
      outline: 2px solid var(--accento);
      outline-offset: -2px;
    }

    .bandiera {
      flex: 0 0 auto;
      width: 36px;
      height: 24px;
      border-radius: 3px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35);
    }

    .bandiera svg { display: block; width: 100%; height: 100%; }

    @media (max-width: 480px) {
      .riquadro { padding: 28px 18px; }
      .lingue a { font-size: 1.3rem; }
    }
  </style>
</head>
